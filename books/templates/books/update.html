<h1>更新書的資訊</h1>

<form action="{% url 'books:update' book.id %}" method="post">
    {% csrf_token %}
    <div>
        <label for="title">書名</label>
        <input name="title" type="text" value="{{ book.title }}">
    </div>
    <div>
        <label for="publisher">出版商</label>
        <input name="publisher" type="text" value="{{ book.publisher }}">
    </div>
    <div>
        <label for="publication_date">出版日期</label>
        <input name="publication_date" type="date" value="{{ book.publication_date|date:'Y-m-d'}}">
    </div>
    <div>
        <label for="price">價格</label>
        <input name="price" type="number" value="{{ book.price }}">
    </div>
    <div>
        <label for="page">頁數</label>
        <input name="page" type="number" value="{{ book.page }}">
    </div>

    <a href="{% url 'books:show' book.id %}">回上一頁</a>
    <input type="submit" value="更新">
</form>
