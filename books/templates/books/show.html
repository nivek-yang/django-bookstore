<h1>書名: {{ book.title }}</h1>
<h2>出版商: {{ book.publisher }}</h2>
<h2>出版日期: {{ book.publication_date }}</h2>
<h2>價格: {{ book.price }}</h2>
<h2>頁數: {{ book.page }}</h2>


<a href="{% url 'books:index' %}">回書籍列表</a>

<a href="{% url 'books:update' book.id %}">修改</a>

<form action="{% url 'books:delete' book.id %}" method="post" onsubmit="return confirm('確定要刪除？')">
    {% csrf_token %}
    <button>刪除</button>
</form>
